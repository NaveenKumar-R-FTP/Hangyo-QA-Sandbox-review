<template>
  <lightning-card title="Claim Form">
    <div class="slds-p-around_medium">
        <!-- Month Section -->
         <div class="center-container">
            <label class="slds-form-element__label">
              <strong> Choose Month </strong></label>
            <lightning-input 
type="month" 
 value={selectedMonth}
onchange={handleInputChangeDate}>
</lightning-input>
<p if:true={errorMessage} class="error-message">
{errorMessage}
</p>
         </div>
 
      <template if:true={showSections}>
        <!-- Section 1 -->
        <div class="section">
          <h2 class="section-title">Section 1</h2>
           <div class="section-underline"></div>
          <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
               Primary Purchase for the Month</label>
              <lightning-input
                 name="primaryPurchase"
                type="number"
                value={primaryPurchase}
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
                <label class="slds-form-element__label">
                Secondary Sales for the Month</label>
              <lightning-input
                name="secondarySales"
                type="number"
                value={secondarySales}
                onchange={handleInputChange}
              ></lightning-input>
            </div>
          </div>
        </div>

        <!-- Section 2 -->
        <div class="section">
          <h2 class="section-title">Section 2 – Part A</h2>
           <div class="section-underline"></div>
          <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Dealer Discount
                <lightning-helptext content={helpTexts.Dealer_Discount__c}></lightning-helptext>
              </label>
              <lightning-input
                name="dealerDiscount"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Product Complaint / Damages
                <lightning-helptext content={helpTexts.Product_Complaint__c}></lightning-helptext>
              </label>
              <lightning-input
                name="productComplaint"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Outstation Transport Support
                <lightning-helptext content={helpTexts.Outstation_Transport_Support__c}></lightning-helptext>
              </label>
              <lightning-input
                name="transportSupport"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Freezer Subsidy / Repairs
                <lightning-helptext content={helpTexts.Freezer_subsidy_Repairs__c}></lightning-helptext>
              </label>
              <lightning-input
                name="freezerSubsidy"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">Schemes</label>
              <lightning-input
                name="schemes"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Stall Rents / Event Sales Discounts
                <lightning-helptext content={helpTexts.Stall_Rents_Event_Sales_Discounts__c}></lightning-helptext>
              </label>
              <lightning-input
                name="eventSalesDiscounts"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Party Orders / Institutional Discounts
              </label>
              <lightning-input
                name="institutionalDiscounts"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
          </div>
        </div>

        <!-- Section 3 -->
        <div class="section">
          <h2 class="section-title">Section 3 – Part B</h2>
           <div class="section-underline"></div>
          <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Cold Room Support</label>
            <lightning-input
                name="coldRoomSupport"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Approved Special Claims, if any
                <lightning-helptext content={helpTexts.Approved_Special_claims_if_any__c}></lightning-helptext>  </label>
            <lightning-input
                name="approvedSpecialClaims"
                type="number"
                onchange={handleInputChange}
              ></lightning-input>
            </div>
            
            <div class="slds-col slds-size_1-of-4 slds-p-around_small">
              <label class="slds-form-element__label">
                Special Claim Type</label>
                <lightning-combobox
                options={typePicklistValues}
                name="specialClaimType"
                onchange={handleInputChange}
              ></lightning-combobox>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
         <div class="slds-grid slds-grid_align-end slds-m-top_medium">
       
         <button class="custom-button" onclick={handleSubmit}>Submit</button>
    </div>
      </template>
    </div>
  </lightning-card>
</template>
