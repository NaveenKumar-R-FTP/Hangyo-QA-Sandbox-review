<template>
    <div class="invoice-actions">
                <template if:true={canEdit}>
            <a href={editUrl} class="pink-btn">Edit Invoice</a>
        </template>
        <a href={collectionUrl} class="pink-btn">New Collection</a>
        <a href={returnsUrl} class="pink-btn">Secondary Returns</a>
        <a href={downloadUrl} class="pink-btn">Download Invoice</a>
        <template if:true={canCancel}>
            <button type="button" class="pink-btn" onclick={openConfirm}>Cancel Invoice</button>
        </template>
    </div>

    <template if:true={showConfirm}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="max-width: 420px;">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Cancel Invoice</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Are you sure you want to cancel this invoice?</p>
                </div>
                <footer class="slds-modal__footer">
                    <button type="button" class="pink-btn-neutral" onclick={closeConfirm} disabled={isCancelling}>No</button>
                    <button type="button" class="pink-btn" onclick={confirmCancel} disabled={isCancelling}>Yes, Cancel Invoice</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
