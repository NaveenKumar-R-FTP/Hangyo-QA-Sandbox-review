<template>
    <div style ="height: 100%; width: 100%; overflow: auto;">
        <lightning-card title="New Collection">
            
            <div  style ="min-height:70vh;height:100%;" >
                <div class="slds-p-around_medium">
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col" style="width: 100%;">
                            <div class="search-filter-container slds-text-title_bold" style="width: 100%;">
                                <lightning-input
                                    label="Search Customer"
                                    type="search"
                                    placeholder="Search by Customer Name"
                                    onchange={handleRetailerSearch}>
                                </lightning-input>
                            </div>
                            <div style="height: 300px; overflow-y: auto; border: 1px solid #d8dde6; width: 100%;">
                                <lightning-datatable
                                    key-field="value"
                                    data={filteredRetailerOptions}
                                    columns={retailerColumns}
                                    selected-rows={selectedRetailers}
                                    max-row-selection="1"
                                    onrowselection={handleRetailerSelection}>
                                </lightning-datatable>
                            </div>
                        </div>
                        
                 <!--    <div class="slds-col">
                            <div class="search-filter-container slds-text-title_bold">
                                <lightning-input
                                    label="Search Retailer"
                                    type="search"
                                    placeholder="Search by Retailer Name"
                                    onchange={handleRetailerSearch}>
                                </lightning-input>
                            </div>
                            <div style="height: 300px; overflow-y: auto; border: 1px solid #d8dde6;width:100vw">
                                <lightning-datatable
                                    key-field="value"
                                    data={filteredRetailerOptions}
                                    columns={retailerColumns}
                                    selected-rows={selectedRetailers}
                                    max-row-selection="1"
                                    onrowselection={handleRetailerSelection}>
                                </lightning-datatable>
                            </div>
                            <lightning-combobox 
                                name="retailerDropdown"
                                label="Select Retailer"
                                placeholder="Choose a retailer"
                                options={retailerOptions}
                                value={selectedRetailer}
                                onchange={handleChange}>
                            </lightning-combobox>
                        </div> -->
                        
                        
                    </div>
                  
                    <div class="slds-p-around_medium"></div>
                    
                    <template if:true={selectedRetailer}>
                        <div class="slds-col">
                            <p>
                                <strong>Available Credit Notes:</strong>&nbsp; {totalCreditNotes}
                                
                            </p>
                            <p>
                                <strong>Total Credit Amount: ₹</strong> &nbsp;<lightning-formatted-number value={totalCreditAmount} format-style="currency"></lightning-formatted-number>
                            </p>
                        </div>
                        <table class="slds-table slds-table_bordered slds-table_striped">
                            <thead>
                                <tr>
                                    <th>Invoice Number</th>
                                    <th>Invoice Date</th>
                                    <th>Invoice Amount</th>
                                    <th>Current Outstanding Amount</th>
                                    
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={invoices} for:item="invoice">
                                    <tr key={invoice.Id}>
                                        <td>{invoice.Invoice_Number__c}</td>
                                        <td>{invoice.formattedDate}</td>
                                        <td>₹{invoice.Invoice_Amount__c}</td>
                                        <td>₹{invoice.Total_Payable_Balance__c}</td>
                                        
                                        <td>
                                            <lightning-button 
                                                variant="brand" 
                                                label="Select" 
                                                onclick={handleSelectClick} 
                                                data-invoice-id={invoice.Id}>
                                            </lightning-button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    
                    <div class="slds-p-around_medium slds-box slds-theme_shade">
                        <div class="slds-grid slds-wrap slds-grid_align-spread">
                            <div class="slds-col slds-size_1-of-2 slds-text-align_left">
                                <p>
                                    <strong>Total Invoice Amount:</strong>₹ {totalAmount}
                                </p>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-text-align_center">
                                <p>
                                    <strong>Total Outstanding:</strong>₹ {totalCurrentOutstanding}
                                </p>
                            </div>
                            
                        </div>
                    </div>
                </template>
                <div class="slds-p-around_medium"></div>
                
                
                    <!-- Modal for entering amount -->
                    <template if:true={isModalOpen}>
                        <section class="slds-modal slds-fade-in-open">
                            <div class="slds-modal__container">
                                <!-- Modal Header -->
                                <header class="slds-modal__header">
                                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                            title="Close"
                                            onclick={handleCloseModal}>
                                        <lightning-icon icon-name="utility:close" size="small" alternative-text="close"></lightning-icon>
                                        <span class="slds-assistive-text">Close</span>
                                    </button>
                                    <h2 class="slds-text-heading_medium">Payment Details</h2>
                                </header>
                    
                                <!-- Total Credit Amount & Credit Amount Input Side by Side -->
                                <div class="slds-modal__content slds-p-around_medium">
                                    <div class="slds-grid slds-gutters">
                                        <!-- Total Credit Amount Display -->
                                        <div class="slds-col slds-size_1-of-2">
                                            <p>
                                                <strong>Total Credit Amount: </strong> &nbsp;
                                                <lightning-formatted-number value={totalCreditAmount} format-style="currency"></lightning-formatted-number>
                                            </p>
                                            <p>
                                                <strong>Total Outstanding: </strong>&nbsp; ₹{selectedTotalPayableBalance}
                                            </p>
                                        </div>
                                        <!-- Credit Amount Input -->
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input 
                                                label="Enter credit amount" 
                                                value={creditAmountEntered} 
                                                onchange={handleCreditAmountEntered}
                                                disabled={isCreditDisabled}
                                                type="number" 
                                                 step="0.01" >
                                            </lightning-input>
                                        </div>
                                    </div>
                                </div>
                    
                                <!-- Payment Method & Amount Collected Side by Side -->
                                <div class="slds-modal__content slds-p-around_medium">
                                    <div class="slds-grid slds-gutters">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox 
                                                name="paymentMethodDropdown"
                                                label="Payment Method"
                                                placeholder="Select Payment Method"
                                                options={paymentMethodOptions}
                                                value={selectedPaymentMethod}
                                                onchange={handlePaymentMethodChange}>
                                            </lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input 
                                                label="Amount Collected" 
                                                value={amountCollected} 
                                                onchange={handleAmountChange}
                                                disabled={isAmountDisabled}
                                                type="number" 
                                                 step="0.01">
                                            </lightning-input>
                                        </div>
                                    </div>
                                </div>
                    
                                <!-- Payment Date -->
                                <div class="slds-modal__content slds-p-around_medium">
                                    <div class="slds-grid slds-gutters">
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input 
                                            type="date"
                                            label="Payment Date"
                                            value={paymentDate}
                                            onchange={handlePaymentDateChange}>
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-input 
                                            type="text"
                                            label="Narration"
                                            value={narration}
                                            onchange={handleNarrationChange}>
                                            </lightning-input>
                                        </div>
                                    </div>
                                </div>
                    
                                <!-- Cheque Details (Only Visible If Payment Method is Cheque) -->
                                <template if:true={isCheque}>
                                    <div class="slds-modal__content slds-p-around_medium">
                                        <div class="slds-grid slds-gutters">
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input 
                                                    label="Cheque Number" 
                                                    value={chequeDetails.chequeNumber} 
                                                    data-field="chequeNumber"
                                                    onchange={handleInputChange}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input 
                                                    type="date" 
                                                    label="Cheque Date" 
                                                    value={chequeDetails.chequeDate}
                                                    data-field="chequeDate" 
                                                    onchange={handleInputChange}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </div>
                    
                                    <div class="slds-modal__content slds-p-around_medium">
                                        <div class="slds-grid slds-gutters">
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input 
                                                    label="Branch Name" 
                                                    value={chequeDetails.branchName} 
                                                    data-field="branchName"
                                                    onchange={handleInputChange}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                                                <label> Cleared</label>
                                                <lightning-input 
                                                    type="checkbox"                                 
                                                    checked={chequeDetails.isChequeCleared} 
                                                    data-field="isChequeCleared"
                                                    onchange={handleInputChange}>
                                                </lightning-input>
                                            </div>                        
                                        </div>
                                    </div>
                                </template>
                                
                               <footer class="slds-modal__footer">
    <div class="slds-grid slds-wrap slds-align_absolute-center slds-p-around_xx-small slds-text-align_left" style="justify-content: space-between; width: 100%;">
        <p style="margin: 0;">
            Total Collection is ₹ {totalCollectionAmount}
        </p>
        <div>
            <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal}></lightning-button>
            <lightning-button class="slds-m-left_small" variant="brand" label="Save" onclick={handleSaveCollection}></lightning-button>
        </div>
    </div>
</footer>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </template>
                    
                </div>
                
                <div class="slds-p-around_medium">
                    <lightning-button 
                        variant="brand" 
                        label="Close" 
                        onclick={handleClose}>
                    </lightning-button>
                </div>                
            </div>
        </lightning-card>
    </div>
    
</template>
