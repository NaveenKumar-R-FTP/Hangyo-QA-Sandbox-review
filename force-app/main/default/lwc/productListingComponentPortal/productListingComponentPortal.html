                        </div-->

                      <span class="slds-badge">{pro.productBrand}</span>
                    </div>

                    </div>
                    <div class="slds-var-p-around_xxx-small" style="font-size: small;">UOM: 
                      {pro.uom}
                    </div>
                    <div class="slds-var-p-around_xxx-small" style="font-size: small;">Per Crate: 
                      {pro.crateconversion}
                    </div>
                    <div class="slds-var-p-around_xxx-small" style="font-size: small;">
                      <Strong>Available Stock: </Strong>
                      {pro.inventoryQty}
                    </div>
                    <template if:true={pro.showMOQ}>
                      <div class="slds-var-p-around_xxx-small" style="font-size: small;">MOQ: 
                        {pro.minOrderQuantity}
                      </div>
                    </template>
                    <div class="slds-var-p-around_xxx-small" style="font-size: small;">MRP: 
                      <span class="dollars">{pro.productMrp}</span>
                    </div>


                    <div class="slds-var-p-around_xxx-small">
                      <div style="display : inline;font-size: small;">
                            <!--span class="dollars" style="margin-right: 10px;text-decoration: line-through;">{pro.productListPrice}</span -->
                            
                            <span class="dollars">{pro.productOfferPrice}</span>
                              
                          </div>

                          <template if:true={isUnderSS}>
                          <div class="slds-var-p-around_xxx-small">
                                         
                            <button class="quantity-scheme-button" style="font-family: Arial;"   data-product-id={pro.productId}  onclick={openSchemeFromProduct}>
                              Schemes
                            </button>
                          </div>
                          </template>
      
                      <div class="slds-var-p-around_xxx-small" style="font-size: small;">
                        {pro.addedQuantity} items already added to cart.
                      </div>
                        
                    
                    <div class="slds-grid_vertical-align-center">
                    <div class="quantity buttons_added slds-align_absolute-center">
                      <input type="button" value="-" onclick={minusQuantity} class="minus" name={pro.productId}>

                      <input type="button" value="+" class="plus" onclick={addtionQuantity} name={pro.productId}>

                    <button class="addCartButton slds-var-p-around_xxx-small" data-product-id={pro.productId}

<template if:true={openCart}>
<div class="slds-grid slds-grid_vertical slds-grid_align-center" style="width: 100%; overflow-y: auto; ">

<!-- Header -->
<header class="slds-grid slds-grid_align-spread slds-p-around_medium" style="width: 100%;margin-top:10px;">
  <h2 class="slds-text-heading_medium" >My Cart</h2>
  <!--<lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={closeCart} variant="bare" ></lightning-button-icon>-->
</header>

<!-- Cart Content -->
<div class="slds-grid slds-wrap slds-p-around_medium " style="flex-grow: 1; justify-content: space-between; max-width: 90%;">
  
  <!-- Product Section -->
   <div class="slds-col slds-size_1-of-1" style="width:108%;">
    <template for:each={serializedCartItems} for:item="pro">
  <lightning-card key={pro.productId} variant="Narrow" class="slds-m-vertical_small">
    <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-var-p-around_xxx-small">
          
          <!-- Product Image -->
          <!--div class="slds-col slds-size_1-of-7 number-circle">
            <--img src={pro.productImage} alt={pro.productImage} style="width: 100%; height: 80px; object-fit: contain;">
           
          </div-->

          <div class="slds-col slds-size_1-of-12 serial-number-container">
        <div class="serial-number">{pro.serialNumber}</div>
      </div>

          <!-- Product Details -->
          <div class="slds-col slds-size_3-of-12 slds-var-p-left_small">
            <div>
              <template if:true={pro.isPromotional}>
                  <span class="promo-badge slds-m-right_x-small">PROMO</span>
              </template>
            </div>
            <b>{pro.productBrand}</b>
            <div>{pro.productName}</div>
            <div>UOM: {pro.prodmeasure}</div>
            <div>Per Crate:{pro.crateconversion}</div>
            <div>Available Stock:{pro.availableStockQuantity}</div>
            <template if:true={pro.showMOQ}>
              <div>MOQ:{pro.minOrderQuantity}</div>
            </template>
          </div>

          <!-- Price -->
          <div class="slds-col slds-size_1-of-12">
            <span class="dollars">{pro.productOfferPrice}</span>
          </div>

          <!-- <div class="slds-col slds-size_1-of-8">
            <b> 𝑥 </b>
          </div> -->

          <!-- Quantity Controls -->
          <div class="slds-col slds-size_2-of-12">
            <div class="quantity buttons_added">
              <input type="button" value="-" onclick={minusQuantityCart} class="minus" name={pro.productIdForCart} disabled={pro.isReadOnly}>
              <input type="number" name={pro.productIdForCart} value={pro.quantity} onchange={valueQtyHandleCart} disabled={pro.isReadOnly}
                     class="input-text qty text" size="4" min="1">
              <input type="button" value="+" onclick={additionQuantityCart} class="plus" name={pro.productIdForCart} disabled={pro.isReadOnly}>
            </div>
          </div>

           <!-- Crate -->
          <div class="slds-col slds-size_1-of-12">
            <div>{pro.crateDisplay}</div>
          </div>
                  <!-- Total Price (1/6) -->
          <div class="slds-col slds-size_1-of-12">
            <span class="dollars">{pro.unittotalPrice}</span>
          </div>

          <!-- Apply Quantity Scheme Button -->
           
          <div class="slds-col slds-size_2-of-12 slds-text-align_center">
            <template if:true={isUnderSS}>
              <template if:false={pro.isPromotional}>
              <button class="slds-var-m-right_small value-scheme-button" data-product-id={pro.productId}  onclick={openSchemeFromCart}>
                  Apply Quantity Scheme
              </button>
              </template>
              </template>
          </div>

          <!-- Delete Button -->
          <div class="slds-col slds-size_1-of-12 slds-text-align_right">
            <lightning-button-icon
              icon-name="utility:delete"
              alternative-text="Remove Product"
              name={pro.productIdForCart}
              variant="bare"
              class="slds-var-m-right_small"
              onclick={removeProductFromCart}
              style="fill:rgb(155, 16, 16);"
              disabled={pro.disableDelete}>
            </lightning-button-icon>
          </div>
          
        </div>
                    </lightning-card>
    </template>
  </div>
<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="width: 108%; ">
<!-- <lightning-card title="Price Details"> -->
<lightning-card>
   <div class="slds-grid slds-grid_align-spread">
        <h2 class="slds-text-heading_medium slds-var-m-left_small changeFont">Price Details</h2>
    
            <!-- Value Scheme Button -->
            <template if:true={isUnderSS}>
                <button class="slds-var-m-right_small value-scheme-button"   onclick={openDialogForValueScheme}>
                Apply Value Scheme
                </button>
            </template>
    </div>
    <div class="slds-var-p-left_small slds-var-p-right_small slds-var-p-top_small slds-var-p-bottom_small">

            <div style="font-family: Arial;font-size: 14px; font-weight: bold; margin-bottom: 2px;margin-top: 8px;">Value Scheme Applied:</div>
            <div style="font-family: Arial;color: #C1206B; font-weight: bold; font-size: 14px;">{ValueSchemeFinalName}</div>
    
        </template>
        <div class="slds-grid slds-grid_align-spread">
            <span>Total Items:</span>
            <span>{orderSummary.totalItems}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Total Quantity:</span>
            <span>{orderSummary.totalQuantity}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Total Crate:</span>
            <span>{orderSummary.totalCrates}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Price:</span>
            <span class="dollars">{orderSummary.totalOrderValue}</span>
        </div>
        <template if:true={showtotalCGSTtax}>
          <div class="slds-grid slds-grid_align-spread">
            <span>CGST[{percentCGST}%]:</span>
            <span class="dollars">{orderSummary.totalCGST}</span>
          </div>
          <div class="slds-grid slds-grid_align-spread">
              <span>SGST[{percentSGST}%]:</span>
              <span class="dollars">{orderSummary.totalSGST}</span>
          </div>
        </template>
        <template if:true={showtotalIGSTtax}>
          <div class="slds-grid slds-grid_align-spread">
            <span>IGST[{percentIGST}%]:</span>
            <span class="dollars">{orderSummary.totalIGST}</span>
          </div>
        </template>
        <hr/>
        <div class="slds-grid slds-grid_align-spread">
            <b>Total Amount:</b>
            <b class="dollars">{orderSummary.totalPrice}</b>
        </div>
    </div>
</lightning-card>
</div>
<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="width: 108%;">

<template if:true={isQualityScheme}>
        <section class="slds-modal slds-fade-in-open" aria-hidden="false">

                  <div class="pink-close-icon">
                  <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                  </div>
              </button>
                
                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Quantity Schemes</h2>
                
                </header>
        
                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium modal-body-scrollable">
                    <!-- <ul class="slds-list_dotted">

                    </ul> -->

                  <template if:true={hasSchemes}>
                      <ul class="slds-has-dividers_around-space">
                          <template for:each={schemeDetails} for:item="scheme">
                              <li key={scheme.schemeId}
                                  class="slds-item slds-p-around_small slds-box slds-theme_default">

                                  <div class="slds-grid slds-wrap slds-align-middle">

                                        <!-- Radio (ONLY for Cart) -->
                                      <template if:true={isCartContext}>
                                          <div class="slds-col slds-size_1-of-12 slds-align_absolute-left">
                                              <input
                                                  type="radio"
                                                  name="schemeRadio"
                                                  value={scheme.schemeId}
                                                  checked={scheme.isSelected}
                                                  disabled={scheme.isDisabled}
                                                  onchange={handleSchemeSelection} />
                                          </div>
                                      </template>

                                      <!-- Scheme Name -->
                                      <div class="slds-col slds-size_3-of-12 slds-text-title_bold">
                                          {scheme.schemeName}
                                      </div>

                                      <!-- Min Qty -->
                                      <div class="slds-col slds-size_2-of-12 slds-text-body_small">
                                          Min Qty: <strong>{scheme.minQty}</strong>
                                      </div>

                                      <!-- Free Qty (placeholder if empty) -->
                                      <div class="slds-col slds-size_1-of-12 slds-text-body_small">
                                          <template if:true={scheme.promoQty}>
                                              Free: <strong>{scheme.promoQty}</strong>
                                          </template>
                                          <template if:false={scheme.promoQty}>
                                              &nbsp;
                                          </template>
                                      </div>

                                      <!-- Discount (placeholder if empty) -->
                                      <div class="slds-col slds-size_1-of-12 slds-text-body_small">
                                          <template if:true={scheme.discountPercentage}>
                                              Disc: <strong>{scheme.discountPercentage}%</strong>
                                          </template>
                                          <template if:false={scheme.discountPercentage}>
                                              &nbsp;
                                          </template>
                                      </div>

                                      <!-- Type -->
                                      <div class="slds-col slds-size_3-of-12 slds-text-body_small slds-text-color_weak">
                                          Type: {scheme.schemeType}
                                      </div>

                                  </div>
                              </li>
                          </template>
                      </ul>
                  </template>


                  <!-- No schemes -->
                  <template if:false={hasSchemes}>
                      <div class="slds-text-color_weak slds-align_absolute-center">
                          No active quantity schemes available for this product
                      </div>
                  </template>
                </div>
        
                <!-- Footer -->
                <footer class="slds-modal__footer slds-grid slds-grid_align-end">
                    <div class="slds-button-group" role="group">
                    <button style="background-color: #C1206B; color: #FFFFFF; margin-right: 5px; padding: 5px 15px; font-size: 12px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.3s ease; width: 100px;" onclick={closeQualitySchemeDialog}>Cancel</button>
                    <template if:true={isCartContext}>

                  </template>
                  </div>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

                                                    On ₹<strong>{scheme.cartAmount}</strong>
                                                </template>
                                                <template if:false={scheme.cartAmount}>
                                                    &nbsp;
                                                </template>
                                            </div>

                                            <!-- Free Qty -->
                                            <div class="slds-col slds-size_2-of-12 slds-text-body_small">
                                                <template if:true={scheme.promoQty}>
                                                    Free: <strong>{scheme.promoQty}</strong>
                                                </template>
                                                <template if:false={scheme.promoQty}>
                                                    &nbsp;
                                                </template>
                                            </div>

                                            <!-- Discount -->
                                            <div class="slds-col slds-size_2-of-12 slds-text-body_small">
                                                <template if:true={scheme.discountPercentage}>
                                                    Disc: <strong>{scheme.discountPercentage}%</strong>
                                                </template>
                                                <template if:false={scheme.discountPercentage}>
                                                    &nbsp;
                                                </template>
                                            </div>

                                            <!-- Apply / Applied -->
                                            <div class="slds-col slds-size_2-of-12 slds-text-align_right">

                                                <template if:true={scheme.isMatchExist}>
                                                    <template if:false={scheme.isApplied}>
                                                        <button class="slds-button slds-button_brand"
                                                                data-apply-id={scheme.id}
                                                                onclick={applyButtonClicked}>
                                                            Apply
                                                        </button>
                                                    </template>

                                                    <template if:true={scheme.isApplied}>
                                                        <button class="slds-button slds-button_success">
                                                            Applied
                                                        </button>
                                                    </template>
                                                </template>

                                            </div>

                                        </div>
                                    </li>

                                </template>
                            </ul>

                        </div>

                        <!-- Footer -->
                        <footer class="slds-modal__footer">
                            <button style="background-color: #C1206B; color: #FFFFFF; margin-right: 5px; padding: 5px 15px; font-size: 12px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.3s ease; width: 100px;" onclick={closeValueSchemeDialog}>Cancel</button>
                        </footer>

                    </div>
                </section>
                <!-- Modal Backdrop -->
                <div class="slds-backdrop slds-backdrop_open"></div>
          </template>


</template>
