<template>

<!-- Display products -->
<template if:true={ShowprodutcList}>

</template>
<template if:true={error}>
<p class="slds-text-color_error">Error loading products: {error.message}</p>
</template>
<template if:true={loading}>
<lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
</template>


<div class="slds-show" data-id="divblock">
<div class="fixedCard">
  <div class="fixed">
<!--svg focusable="false" data-key="back" aria-hidden="true" viewBox="0 0 52 52" style="fill:#C1206B;margin-left:5px;"
      onclick={closeCart} class="slds-p-around_xx-small slds-icon slds-icon-text-default" if:true={openCart}>
      <g>
        <path
          d="M48.6 23H15.4c-.9 0-1.3-1.1-.7-1.7l9.6-9.6c.6-.6.6-1.5 0-2.1l-2.2-2.2c-.6-.6-1.5-.6-2.1 0L2.5 25c-.6.6-.6 1.5 0 2.1L20 44.6c.6.6 1.5.6 2.1 0l2.1-2.1c.6-.6.6-1.5 0-2.1l-9.6-9.6c-.6-.7-.2-1.8.7-1.8h33.2c.8 0 1.5-.6 1.5-1.4v-3c0-.8-.6-1.6-1.4-1.6z">
        </path>
      </g>
    </svg-->
<div class="cart-container" onclick={ooenCartModal}>
      <svg focusable="false" style="fill:#C1206B;" data-key="cart" aria-hidden="true"
        viewBox="0 0 52 52" class="slds-icon slds-icon-text-default">
        <g>
          <g>
            <path
              d="M20.1 26H44c.7 0 1.4-.5 1.5-1.2l4.4-15.4c.3-1.1-.5-2-1.5-2H11.5l-.6-2.3C10.6 4 9.6 3.3 8.6 3.3h-4c-1.3 0-2.5 1-2.6 2.3C1.9 7 3.1 8.2 4.4 8.2h2.3l7.6 25.7c.3 1.1 1.2 1.8 2.3 1.8h28.2c1.3 0 2.5-1 2.6-2.3.1-1.4-1.1-2.6-2.4-2.6H20.2c-1.1 0-2-.7-2.3-1.7V29c-.5-1.5.7-3 2.2-3z">
            </path>
            <circle cx="20.6" cy="44.6" r="4"></circle>
            <circle cx="40.1" cy="44.6" r="4"></circle>
          </g>
        </g>
      </svg>

      <span class="slds-badge slds-theme_error">
        <em>{cartSize}</em>
      </span>

    </div>

    <template if:true={ShowprodutcList}>       
    <div id="main" class="tabset-container" style="margin-top: -40px; position: relative;">
        <!-- Custom "All" tab with dropdown -->
        <div class="custom-tab-container" style="display: inline-flex; position: relative; align-items: flex-start;">
            <button 
                class="custom-tab-button" 
                onclick={handleAllTabClick}
            >
                {allTabDisplayText}
            </button>
            <button 
                class="custom-tab-arrow" 
                onclick={toggleBrandDropdown}
            >
                <lightning-icon 
                    icon-name="utility:down" 
                    size="xx-small"
                ></lightning-icon>
            </button>
            
            <!-- Dropdown menu -->
            <template if:true={showBrandDropdown}>
                <div class="brand-dropdown" style="position: absolute; top: 100%; left: 0; background: white; border: 1px solid #d8dde6; border-radius: 0 0 4px 4px; box-shadow: 0 2px 3px rgba(0,0,0,0.16); z-index: 10000; min-width: 200px; max-height: 300px; overflow-y: auto; margin-top: 0;">
                    <template for:each={allBrandsList} for:item="brand">
                        <div 
                            key={brand}
                            data-brand={brand}
                            onclick={handleBrandDropdownSelect}
                            class="brand-dropdown-item"
                            style="padding: 0.5rem 1rem; cursor: pointer; font-family: Arial; border-bottom: 1px solid #f3f3f3;"
                        >
                            {brand}
                        </div>
                    </template>
                </div>
            </template>
        </div>
        
        <!-- Custom "Available Stock" tab with dropdown -->
        <div class="custom-tab-container" style="display: inline-flex; position: relative; align-items: flex-start; margin-left: 0;">
            <button 
                class="custom-tab-button" 
                onclick={handleAvailableStockTabClick}
            >
                {availableStockTabDisplayText}
            </button>
            <button 
                class="custom-tab-arrow" 
                onclick={toggleAvailableStockDropdown}
            >
                <lightning-icon 
                    icon-name="utility:down" 
                    size="xx-small"
                ></lightning-icon>
            </button>
            
            <!-- Dropdown menu for Available Stock -->
            <template if:true={showAvailableStockDropdown}>
                <div class="brand-dropdown" style="position: absolute; top: 100%; left: 0; background: white; border: 1px solid #d8dde6; border-radius: 0 0 4px 4px; box-shadow: 0 2px 3px rgba(0,0,0,0.16); z-index: 10000; min-width: 200px; max-height: 300px; overflow-y: auto; margin-top: 0;">
                    <template for:each={allBrandsList} for:item="brand">
                        <div 
                            key={brand}
                            data-brand={brand}
                            onclick={handleAvailableStockBrandSelect}
                            class="brand-dropdown-item"
                            style="padding: 0.5rem 1rem; cursor: pointer; font-family: Arial; border-bottom: 1px solid #f3f3f3;"
                        >
                            {brand}
                        </div>
                    </template>
                </div>
            </template>
        </div>
        
        <!-- OLD plain search input (commented) - replaced by Search By + Search row -->
        <!--
        <lightning-input 
            type="search" 
            style="padding: 0px; width:70%; font-family: Arial; margin-top: -15px; display: block; margin-left: auto; margin-right: auto;" 
            placeholder="Search" 
            onchange={handleChangeSearchValue}>
        </lightning-input>
        -->

        <!-- added by Fuzail - Search By row (Name / Code) + Search bar, same UX as secondary order page -->
        <div class="search-by-row">
            <div class="search-by-dropdown-wrapper">
                <span class="search-by-label">Search By</span>
                <button type="button" class="search-by-trigger" onclick={toggleSearchByDropdown}>
                    {searchByDisplayText}
                    <lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon>
                </button>
                <template if:true={showSearchByDropdown}>
                    <div class="search-by-menu">
                        <div data-searchby="Name" onclick={handleSearchByOptionSelect} class="search-by-item">Name</div>
                        <div data-searchby="Code" onclick={handleSearchByOptionSelect} class="search-by-item">Code</div>
                    </div>
                </template>
            </div>
            <lightning-input 
                type="search" 
                class="search-input-inline"
                placeholder="Search" 
                onchange={handleChangeSearchValue}>
            </lightning-input>
        </div>
    </div>

    </template>
    

      
    </div>

        <template if:true={ShowprodutcList}>
        <div class="slds-grid slds-wrap slds-theme_default content" style="margin-top: 40px;" onclick={closeNav}>
            <template for:each={data} for:item="pro">
              <div key={pro.productId}
                class="slds-col slds-size_1-of-2 slds-medium-size_6-of-12 slds-large-size_1-of-5 slds-theme_default slds-var-p-around_xxx-small"
                id={pro.productId} style="top:150px;" data-set="sdsds">
                  <div class="card" key={pro.productId}>
                    <!--div id={pro.productId} class="rich-text-container" >
                        <img src={pro.productDisplayImage} alt={pro.productDisplayImage} style="width: 90%; height: 98%;">
                        </div-->
                    <div class="slds-var-p-around_xxx-small">
                      <span class="slds-badge">{pro.productBrand}</span>
                    </div>
                    
                    <!--div class="slds-var-p-around_xxx-small" style="font-size: small; color: black; font-weight: bold;"-->
                    <div class="slds-var-p-around_xxx-small" style="font-size: small; font-weight: bold;">
                      {pro.productShortDescription}
                    </div>
                    <div class="slds-var-p-around_xxx-small" style="font-size: small;">UOM: 
                      {pro.uom}
                    </div>
                    <div class="slds-var-p-around_xxx-small" style="font-size: small;">Available Stock: 
                      {pro.availableQuantity}
                    </div>


                    <div class="slds-var-p-around_xxx-small">
                      <div style="display : inline;font-size: small;">
                            <!--span class="dollars" style="margin-right: 10px;text-decoration: line-through;">{pro.productListPrice}</span -->
                            
                            <span class="dollars">{pro.productOfferPrice}</span>
                              
                          </div>
                          
                      <div class="slds-var-p-around_xxx-small" style="font-size: small;">
              {pro.addedQuantity} items already added to cart.
              </div>
                        
                    
                    <div class="slds-grid_vertical-align-center">
                    <div class="quantity buttons_added slds-align_absolute-center">
                      <input type="button" value="-" onclick={minusQuantity} class="minus" name={pro.productId}>
    
                      <input data-id ={pro.productId} type="number" step="1" min="1" max="" name="quantity" value={pro.productQuantity}
                        title="Qty" onchange={valueQtyHandle} class="input-text qty text" size="4" pattern="" inputmode="">
    
                      <input type="button" value="+" class="plus" onclick={addtionQuantity} name={pro.productId}>
                    </div>
                    <button class="addCartButton slds-var-p-around_xxx-small" data-product-id={pro.productId}
              onclick={addToCart}>Add</button>
              </div>
              </div>
                  </div>
              </div>
            </template>
        </div>
        <br/>
                            <br/>
                            <br/>
                            <br/>
        <div class="footerCart">
          <span class="slds-text-title_bold">
              TQ: {orderSummary.totalQuantity} / TA: {orderSummary.totalPrice}
          </span>
          <button class="custom-button" onclick={ooenCartModal}>View Cart</button>
        </div>
    </template >




<template if:true={openCart}>
<div class="slds-grid slds-grid_vertical slds-grid_align-center" style="width: 100%; overflow-y: auto; background-color: white;">

<!-- Header -->
<header class="slds-grid slds-grid_align-spread slds-p-around_medium" style="width: 100%;margin-top:20px;">
  <h2 class="slds-text-heading_medium" >My Cart</h2>
  <!--<lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={closeCart} variant="bare" ></lightning-button-icon>-->
</header>

<!-- Cart Content -->
<div class="slds-grid slds-wrap slds-p-around_medium" style="flex-grow: 1; justify-content: space-between; max-width: 90%;">
  
  <!-- Product Section -->
  <div class="slds-col slds-size_1-of-1" style="width:108%;">
    <template for:each={serializedCartItems} for:item="pro">
  <lightning-card key={pro.productId} variant="Narrow" class="slds-m-vertical_small">
    <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-var-p-around_xxx-small">
          
          <!-- Product Image -->
          <!--div class="slds-col slds-size_1-of-7 number-circle">
            <--img src={pro.productImage} alt={pro.productImage} style="width: 100%; height: 80px; object-fit: contain;">
           
          </div-->

          <div class="slds-col slds-size_1-of-8 serial-number-container">
        <div class="serial-number">{pro.serialNumber}</div>
      </div>

          <!-- Product Details -->
          <div class="slds-col slds-size_2-of-8 slds-var-p-left_small">
            <b>{pro.productBrand}</b>
            <div>{pro.productName}</div>
            <div>UOM: {pro.prodmeasure}</div>
            <div>Available Stock: {pro.availableStockQuantity}</div>
          </div>

          <!-- Price -->
          <div class="slds-col slds-size_1-of-8">
            <span class="dollars">{pro.productOfferPrice}</span>
          </div>
          <div class="slds-col slds-size_1-of-8">
            <b> 𝑥 </b>
          </div>

          <!-- Quantity Controls -->
          <div class="slds-col slds-size_1-of-8">
            <div class="quantity buttons_added">
              <input type="button" value="-" onclick={minusQuantityCart} class="minus" name={pro.productIdForCart}>
              <input type="number" name={pro.productIdForCart} value={pro.quantity} onchange={valueQtyHandleCart} 
                     class="input-text qty text" size="4" min="1">
              <input type="button" value="+" onclick={additionQuantityCart} class="plus" name={pro.productIdForCart}>
            </div>
          </div>
                  <!-- Total Price (1/6) -->
          <div class="slds-col slds-size_1-of-8">
            <span class="dollars">{pro.unittotalPrice}</span>
          </div>

          <!-- Delete Button -->
          <div class="slds-col slds-size_1-of-8 slds-text-align_right">
            <lightning-button-icon
              icon-name="utility:delete"
              alternative-text="Remove Product"
              name={pro.productIdForCart}
              variant="bare"
              class="slds-var-m-right_small"
              onclick={removeProductFromCart}
              style="fill:rgb(155, 16, 16);">
            </lightning-button-icon>
          </div>
          
        </div>
                    </lightning-card>
    </template>
  </div>
<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="width: 108%; ">
<lightning-card title="Price Details">
    <div class="slds-var-p-left_small slds-var-p-right_small slds-var-p-top_small slds-var-p-bottom_small">
        <div class="slds-grid slds-grid_align-spread">
            <span>Total Items:</span>
            <span>{orderSummary.totalItems}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Total Quantity:</span>
            <span>{orderSummary.totalQuantity}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Price(Before Discount):</span>
            <span class="dollars">{priceBeforeDiscount}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Price(Exculding Tax):</span>
            <span class="dollars">{priceWithoutTax}</span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Discount:</span>
            <span class="dollars">
              <input type="text" value={discountAmountText} onchange={handlediscountAmountChange} placeholder="Enter Discount"/>
            </span>
        </div>
        <div class="slds-grid slds-grid_align-spread">
            <span>Price(After Discount):</span>
            <span class="dollars">{orderSummary.totalOrderValue}</span>
        </div>
        <template if:true={showtotalCGSTtax}>
          <div class="slds-grid slds-grid_align-spread">
            <span>CGST[{percentCGST}%]:</span>
            <span class="dollars">{orderSummary.totalCGST}</span>
          </div>
          <div class="slds-grid slds-grid_align-spread">
              <span>SGST[{percentSGST}%]:</span>
              <span class="dollars">{orderSummary.totalSGST}</span>
          </div>
        </template>
        <template if:true={showtotalIGSTtax}>
          <div class="slds-grid slds-grid_align-spread">
            <span>IGST[{percentIGST}%]:</span>
            <span class="dollars">{orderSummary.totalIGST}</span>
          </div>
        </template>
        <hr/>
        <div class="slds-grid slds-grid_align-spread">
            <b>Total Amount:</b>
            <b class="dollars">{orderSummary.totalPrice}</b>
        </div>
    </div>
</lightning-card>
</div>
<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2" style="width: 108%;">
    <lightning-textarea 
        label="Order Comment:" 
        value={comment}
        onchange={handleCommentChange}
        placeholder="Enter your comments here...">
    </lightning-textarea>
</div>
 
</div>
</div>
<div class="footer">
  <button class="custom-button" onclick={closeCart}>Back</button>
  <button class="custom-button" onclick={generateProposalAndCloseCart} disabled={isOrderPlaced}>
      Place Order
  </button>
</div>
</template>


  </div>
</div>
 <!-- Footer -->


    


</template>
