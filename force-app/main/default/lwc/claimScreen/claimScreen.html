<template>
    <template if:true={loader}>
    <div class="spinner-container">
        <c-spinner alternative-text="Loading" size="large"></c-spinner>
    </div>
</template>

    <template if:false={loader}>
    <div class="claim-container">
        <h1 class="page-title">Create New Claim</h1>

        <!-- Claim Header -->
        <div class="card claim-header">
            <h2 class="section-title">
                <span class="icon">📄</span> Claim Header
            </h2>

            <!-- First row -->
            <div class="form-row">
                <div class="form-group">
                <lightning-combobox style="font-weight: bold;" name="Distributor" label="Distributor" value={selectedAccount} placeholder="Select a Distributor"
                    options={accountOptions} onchange={handleAccountChange} disabled={distributordisable} required>
                </lightning-combobox>
                

                </div>
                <div class="form-group">
                    <lightning-combobox  style="font-weight: bold;" name="month" label="Claim Month" value={selectedMonth} placeholder="Select Month" options={monthOptions}
                        onchange={handleMonthChange} required>
                    </lightning-combobox>
                    
                </div>
                <div class="form-group">
                    <lightning-combobox style="font-weight: bold;" name="year" label="Claim Year" placeholder="Select Year" options={yearOptions}
                       disabled={disableyear} value={selectedYear} onchange={handleYearChange}>
                    </lightning-combobox>
                </div>
                <div class="form-group">
                    
                     <lightning-input style="font-weight: bold;" type="date" label="Submitted Date" value={submittedDate} onchange={handleDateChange} disabled={disableyear}></lightning-input>
                </div>
                <div class="form-group">
                <lightning-combobox  style="font-weight: bold;" name="status" label="Claim Status" placeholder="Select Status"  value={selectedStatus} options={statusOptions}
                    onchange={handleStatusChange} disabled={disableyear}>
                </lightning-combobox>
                </div>
            </div>

            <!-- Second row (side by side) -->
            <div class="form-row">
                <div class="form-group half">
                    <label style="font-weight: bold;" >Claim Description</label>
                    <textarea placeholder="Describe the claim" onchange={handleDescriptionChange}></textarea>
                </div>
             </div>
        </div>

        <!-- Claims Section -->
        <div class="card claim-section">
            <div class="section-header" >
                <h2 class="section-title" >Claims</h2>
                <button class="btn-add" onclick={addRow} disabled={isAddDisabled}>+ Add Claim</button>
            </div>

            <table class="claims-table">
                <thead>
                    <tr >
                        <th required>Claim Type</th>
                        <th required>Amount</th>
                        <th required >Claim Date</th>
                        <th>Remarks</th>
                        <th required>Attachment</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={claimRows} for:item="row">
                        <tr key={row.id} data-key={row.id}>

                            <td>
                                <lightning-combobox name="caseType" placeholder="Select Claim Type" options={claimTypeOptions}
                                    value={row.caseTypeId} onchange={handleFieldChange}>
                                </lightning-combobox>
                            </td>
                            <td>
                                <lightning-input name="Amount" step="1"  type="string" placeholder="Amount" value={row.amount} onchange={handleFieldChange}>
                                </lightning-input>
                                
                            </td>
                            <td>
                                <lightning-input name ="ClaimDate" min={minClaimDate} max={maxClaimDate} type="date" value={row.date} onchange={handleFieldChange}></lightning-input>
                            </td>
                            <td>
                                <lightning-input name="Remarks" type="text" placeholder="Remarks" value={row.remarks} onchange={handleFieldChange}>
                                </lightning-input>
                            </td>
                            <td>
                                <!--input style="margin-top: 10px;height: 42px;"
                                       name="file"
                                       multiple
                                       data-key={row.id}
                                       type="file"
                                       accept=".jpg,.jpeg,.png,.pdf,.xls,.xlsx, .txt"
                                       onchange={handleFieldChange}/-->
                                        <label class="custom-file-upload">
                                            Choose Files
                                            <input
                                                type="file"
                                                multiple
                                                data-key={row.id}
                                                accept=".jpg,.jpeg,.png,.pdf,.xls,.xlsx,.txt"
                                                onchange={handleFieldChange}
                                            />
                                        </label>
                                    <!-- ✅ Show ONLY when files exist -->
                                    <template if:true={row.files.length}>
                                        <div class="file-preview-box">
                                            <template for:each={row.files} for:item="file" for:index="index">
                                                <div key={file.name} class="file-chip">
                                                <span
                                                    class="file-name clickable"
                                                    data-index={index}
                                                    data-id={row.id}
                                                    onclick={previewFile}>
                                                    {file.name}
                                                </span>
                                                
                                                <lightning-icon icon-name="utility:close" size="x-small" class="remove-icon" data-index={index}
                                                        data-id={row.id} onclick={removeFile}>
                                                    </lightning-icon>
                                    
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    
                                    
                                    </td>
                            <td>
                            <button class="slds-button slds-button_icon slds-button_icon-border-filled delete-btn"
                                    title="Delete">
                                <lightning-icon icon-name="utility:delete" alternative-text="Delete" size="x-small"
                                                onclick={removeRow} data-id={row.id}></lightning-icon>
                            </button>

                            </td>
                        </tr>
                    </template>
                </tbody>
                
                </table>
        </div>

        <!-- Footer Buttons -->
        <div class="footer-buttons">
            <button class="btn-cancel" onclick={handlecancel}>Cancel</button>
            <button class="btn-submit"  onclick={handleSubmit} disabled={disablesavebuttonn}>Submit Claim</button>
        </div>
    </div>
    </template>
</template>
