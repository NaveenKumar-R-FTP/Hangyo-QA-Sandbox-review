<template>
    <div class="slds-col slds-size_1-of-1">
        <div class="slds-p-around_medium">
          
                            <button class="custom-buttonSelfie" onclick={startCamera}>Upload Image</button>

        </div>
        <div class="camera-container">
            <template if:true={isCameraOn}>
                <div class="camera-wrapper">
                    <video autoplay lwc:ref="videoElement" class="video-feed"></video>
                    <div class="slds-p-around_medium slds-grid slds-grid_align-center">
                  

                         <button class="custom-buttonSelfie" onclick={capturePhoto}>Capture Image</button>
                          <button class="custom-buttonSelfie slds-m-left_small" onclick={stopCamera}>Cancel</button>
                     
                    </div>
                </div>
            </template>
              <canvas class="hidden-canvas"></canvas>
            <img if:true={photoURL} src={photoURL} alt="Captured Retailer Image"/>
        </div>
    </div>
</template>
