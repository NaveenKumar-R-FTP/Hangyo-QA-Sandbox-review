<template>
    <div class="card">
        <div class="card-header">
            <div class="title">Call Summary</div>

            <!-- Filter toggle top-right -->
            <div class="toggle-container">
                <span class="toggle-label">VIEW</span>
                <select class="toggle-select"
                        value={filterType}
                        onchange={handleFilterChange}>
                    <option value="FTD">FTD</option>
                    <option value="MTD">MTD</option>
                </select>
            </div>
        </div>

        <div class="metrics">
            <div class="metric">
                <div class="metric-label">TC</div>
                <div class="metric-value">{summary.tc}</div>
            </div>
            <div class="metric">
                <div class="metric-label">PC</div>
                <div class="metric-value">{summary.pc}</div>
            </div>
            <div class="metric">
                <div class="metric-label">SC</div>
                <div class="metric-value">{summary.sc}</div>
            </div>
            <div class="metric">
                <div class="metric-label">NET VALUE</div>
                <div class="metric-value">{formattedNetValue}</div>
            </div>
        </div>
    </div>
</template>
